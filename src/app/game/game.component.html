<div class="text-center">
  <h1 class="text-5xl py-5 bg-orange-300">
    Welcome to {{ title }}!
  </h1>
</div>
<div class="tab-run-number container mx-auto px-4">

  <div class="flex gap-4">
    <button type="button" class="text-white bg-gradient-to-r from-red-400 via-red-500 to-red-600 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-red-300 dark:focus:ring-red-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2" (click)="reset()">รีเซ็ต</button>

    <button type="button" class="py-2.5 px-5 me-2 mb-2 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700" routerLink="/gencard">พิมพ์ใบ</button>
  </div>

  <div class="p-20 mb-4 text-center text-5xl text-green-800 rounded-lg bg-green-50 dark:bg-gray-800 dark:text-green-400" role="alert" *ngIf="finish">
    จบเกมแล้วจ้า!!
  </div>

  <div class="flex justify-center w-full gap-5 mb-5" *ngIf="!finish">
    <div class="w-3/4">
      <input type="number" name="number_current" class="text-9xl text-center w-full border border-gray-300" placeholder="สุ่มเลข" [(ngModel)]="number_current" readonly (keydown.enter)="getCurrentNumber()">
    </div>
    <div class="w-1/4 flex justify-center">
      <button *ngIf="!number_loading" type="button" class="text-white bg-gradient-to-r from-blue-500 via-blue-600 to-blue-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center" (click)="getCurrentNumber()" >สุ่มเลข</button>
      <button *ngIf="number_loading" type="button" class="text-white bg-blue-400 dark:bg-blue-500 cursor-not-allowed font-medium rounded-lg text-sm px-5 py-2.5 text-center" disabled>สุ่มเลข</button>
    </div>
  </div>


  <div class="mb-8">
    <h3>หมายเลขล่าสุด {{history_limit}} ลำดับ</h3>
    <div class="history-box">
      <ng-container *ngFor="let number of number_histories;let ri = index">
        <span class="box2" *ngIf="ri<(number_histories.length-1)">
          {{ number }}
        </span>
        <span class="box1" *ngIf="ri==(number_histories.length-1)">
          {{ number }}
        </span>
      </ng-container>
    </div>
  </div>
</div>

<!-- <iframe [src]="iframe_url" style="height: 0px;width: 0px;"></iframe> -->

<div class="container mx-auto px-4">

  <h3>เลขที่ออก</h3>
  <div class="relative overflow-x-auto">
    <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
            <tr>
                <th scope="col" class="px-6 py-3  text-center" *ngFor="let header of column_headers">
                    {{ header }}
                </th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let row of rows" class="bg-white border-b dark:bg-gray-800 dark:border-gray-700">
              <td *ngFor="let column of columns;" scope="row" class="px-6 py-4 text-gray-900 whitespace-nowrap dark:text-white text-center border border-gray-400" [ngClass]="td_class[(((column*10)+row))]"  >
                <span *ngIf="values[(((column*10)+row))] && values[(((column*10)+row))].status">{{ (column*10)+row }}</span>
              </td>
            </tr>
        </tbody>
    </table>
  </div>
</div>
